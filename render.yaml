# Render Blueprint: API (Node nativo) + Postgres gerenciado. O front vai em Vercel/Cloudflare Pages (apps/web).
# CONFERIR: nomes de chave contra https://render.com/docs/blueprint-spec antes do primeiro deploy.
databases:
  - name: vizinhohub-db
    databaseName: vizinhohub
    plan: basic-256mb      # CONFERIR: nome do plano vigente (free expira em 30 dias)
    region: oregon         # CONFERIR: use a mesma região do web service

services:
  - type: web
    name: vizinhohub-api
    runtime: node
    region: oregon
    plan: starter          # CONFERIR: nome do plano vigente
    # Sem rootDir: a API depende de packages/contracts (exporta .ts), então o build instala os dois.
    # --omit=dev funciona porque tsx está em "dependencies" (a API roda TypeScript direto, sem etapa de build).
    buildCommand: cd packages/contracts && npm ci --omit=dev && cd ../../apps/api && npm ci --omit=dev
    preDeployCommand: cd apps/api && npm run db:setup
    startCommand: cd apps/api && npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24            # CONFERIR: versão de Node suportada pelo Render
      - key: TZ
        value: America/Fortaleza
      - key: DATABASE_URL
        fromDatabase:
          name: vizinhohub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false          # domínio do front, ex.: https://vizinhohub.vercel.app (sem localhost)
      - key: VIP_PROVIDER
        value: mock
      - key: VIP_MOCK_WEBHOOK_SECRET
        generateValue: true
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false
