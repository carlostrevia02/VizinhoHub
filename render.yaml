# Render Blueprint: API (Node nativo) + Postgres gerenciado + front estático (apps/web).
# Planos free (demonstração): o Postgres free expira em 30 dias e a API free dorme sem tráfego. Para produção,
# troque para planos pagos (ex.: starter e basic-256mb) e volte o db:setup para preDeployCommand.
databases:
  - name: vizinhohub-db
    databaseName: vizinhohub
    plan: free             # expira em 30 dias; produção: basic-256mb
    region: oregon         # CONFERIR: use a mesma região do web service

services:
  - type: web
    name: vizinhohub-api
    runtime: node
    region: oregon
    plan: free             # dorme sem tráfego; produção: starter
    # Sem rootDir: a API depende de packages/contracts (exporta .ts), então o build instala os dois.
    # --omit=dev funciona porque tsx está em "dependencies" (a API roda TypeScript direto, sem etapa de build).
    buildCommand: cd packages/contracts && npm ci --omit=dev && cd ../../apps/api && npm ci --omit=dev
    # preDeployCommand não existe no plano free: o db:setup (idempotente) roda antes de subir a API.
    startCommand: cd apps/api && npm run db:setup && npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24            # CONFERIR: versão de Node suportada pelo Render
      - key: TZ
        value: America/Fortaleza
      - key: DATABASE_URL
        fromDatabase:
          name: vizinhohub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://vizinhohub-web.onrender.com   # domínio do front (sem localhost); vírgula separa mais de um
      - key: VIP_PROVIDER
        value: mock
      - key: VIP_MOCK_WEBHOOK_SECRET
        generateValue: true
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false

  # Front React + Vite como site estático (grátis). Depende de packages/contracts, por isso o build instala os dois.
  # VITE_API_URL é lida no build: se a URL da API mudar, refaça o deploy do front.
  - type: web
    name: vizinhohub-web
    runtime: static
    buildCommand: cd packages/contracts && npm ci && cd ../../apps/web && npm ci && npm run build
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: VITE_API_URL
        value: https://vizinhohub-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
