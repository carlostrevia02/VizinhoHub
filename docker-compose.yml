services:
  db:
    image: postgres:16-alpine
    container_name: vizinhohub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vizinhohub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vizinhohub}
      POSTGRES_DB: ${POSTGRES_DB:-vizinhohub}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vizinhohub}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
