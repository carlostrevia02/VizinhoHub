<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Arial, sans-serif" font-size="14">
<rect width="900" height="400" fill="#F3F8F5"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0F3D2E"/></marker></defs>
<text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0F3D2E">Arquitetura em 3 camadas — VizinhoHub</text>
<rect x="30" y="80" width="230" height="230" rx="12" fill="#fff" stroke="#1F7A4D" stroke-width="2"/><rect x="30" y="80" width="230" height="36" rx="12" fill="#1F7A4D"/>
<text x="145" y="104" text-anchor="middle" fill="#fff" font-weight="bold">Apresentação (Frontend)</text>
<text x="145" y="150" text-anchor="middle">VizinhoHub Store</text><text x="145" y="172" text-anchor="middle" fill="#6b7280">vitrine e carrinho (mobile-first)</text>
<text x="145" y="215" text-anchor="middle">VizinhoHub Manager</text><text x="145" y="237" text-anchor="middle" fill="#6b7280">Kanban e gestão de estoque</text>
<text x="145" y="285" text-anchor="middle" fill="#0F3D2E" font-weight="bold">HTML + CSS (protótipo)</text>
<rect x="335" y="80" width="230" height="230" rx="12" fill="#fff" stroke="#1F7A4D" stroke-width="2"/><rect x="335" y="80" width="230" height="36" rx="12" fill="#F59E0B"/>
<text x="450" y="104" text-anchor="middle" fill="#1F2937" font-weight="bold">Aplicação (Core API)</text>
<text x="450" y="150" text-anchor="middle">API REST /api/v1</text><text x="450" y="172" text-anchor="middle" fill="#6b7280">produtos, pedidos, usuários</text>
<text x="450" y="215" text-anchor="middle">Gateway WebSocket</text><text x="450" y="237" text-anchor="middle" fill="#6b7280">order:created / status_updated</text>
<text x="450" y="285" text-anchor="middle" fill="#0F3D2E" font-weight="bold">Node.js (planejado)</text>
<rect x="640" y="80" width="230" height="230" rx="12" fill="#fff" stroke="#1F7A4D" stroke-width="2"/><rect x="640" y="80" width="230" height="36" rx="12" fill="#0F3D2E"/>
<text x="755" y="104" text-anchor="middle" fill="#fff" font-weight="bold">Dados</text>
<text x="755" y="150" text-anchor="middle">PostgreSQL</text><text x="755" y="172" text-anchor="middle" fill="#6b7280">users, products, categories</text>
<text x="755" y="194" text-anchor="middle" fill="#6b7280">orders, order_items</text>
<text x="755" y="285" text-anchor="middle" fill="#0F3D2E" font-weight="bold">Docker Compose</text>
<line x1="262" y1="195" x2="333" y2="195" stroke="#0F3D2E" stroke-width="2.5" marker-end="url(#a)"/><line x1="567" y1="195" x2="638" y2="195" stroke="#0F3D2E" stroke-width="2.5" marker-end="url(#a)"/>
<text x="297" y="185" text-anchor="middle" font-size="11">HTTP/WS</text><text x="602" y="185" text-anchor="middle" font-size="11">SQL</text>
<text x="450" y="360" text-anchor="middle" fill="#6b7280">Cliente e Comerciante acessam o mesmo backend; o WebSocket empurra pedidos ao painel em tempo real.</text>
</svg>
