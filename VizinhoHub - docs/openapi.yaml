                          required:
                            - open
                            - close
                        - type: "null"
                  required:
                    - weekdays
                    - saturday
                    - sunday
                delivery:
                  type: object
                  properties:
                    deliveryEnabled:
                      type: boolean
                    pickupEnabled:
                      type: boolean
