components:
  schemas:
    Error:
      type: object
      description: "Envelope de erro de toda a API. `code` é estável (o frontend decide a mensagem por ele); `details` só aparece em alguns erros (ex.: lista de campos em `VALIDATION_ERROR`)."
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              examples:
                - VALIDATION_ERROR
            message:
              type: string
            details:
              description: Informação extra opcional.
  responses:
    BadRequest:
      description: Dados inválidos (`VALIDATION_ERROR`, com `details` por campo) ou requisição malformada (`BAD_REQUEST`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: VALIDATION_ERROR
              message: Dados inválidos.
    Unauthorized:
      description: Sem login, token inválido ou expirado (`UNAUTHENTICATED`, `INVALID_TOKEN`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UNAUTHENTICATED
              message: Faça login para continuar.
    Forbidden:
      description: O papel do usuário não pode usar esta rota (`FORBIDDEN`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: FORBIDDEN
              message: Você não tem permissão para esta ação.
    NotFound:
      description: Recurso não encontrado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: NOT_FOUND
              message: Não encontrado.
    Conflict:
      description: Conflito com o estado atual (registro já existe, transição inválida etc.).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: DUPLICATE
              message: Registro já existe.
    Unprocessable:
      description: Regra de negócio violada (estoque insuficiente, período inválido, referência inexistente etc.).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: INVALID_REFERENCE
              message: Referência inexistente.
    TooManyRequests:
      description: Limite de requisições excedido.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: RATE_LIMITED
              message: Muitas tentativas. Tente novamente mais tarde.
    NotImplemented:
      description: Recurso não configurado neste servidor.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: NOT_CONFIGURED
              message: Recurso não configurado.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token devolvido por `POST /auth/login`, `/auth/register` ou `/auth/firebase`. Cole só o token (o Swagger UI acrescenta `Bearer`). O papel (`MERCHANT`/`CUSTOMER`) vem do banco, não do token.
