# Gerado por `npm run openapi` (apps/api) a partir do código: não edite à mão.
# Fonte: apps/api/src/docs. Em execução: GET /api/openapi.json e Swagger UI em /api/docs.
openapi: 3.1.0
info:
  title: VizinhoHub API
  version: 0.1.0
  description: |-
    API do VizinhoHub: vitrine de mercadinhos de bairro com Salva-Estoque, pedidos em tempo real, entrega, caderneta, Clube VIP e mais.

    Base: `/api/v1` (`/api` continua valendo). Erros seguem o envelope `{ "error": { "code", "message", "details?" } }`. Tempo real (pedidos, entregas, impressão) usa Socket.IO no mesmo servidor e não faz parte deste documento.

    Gerado a partir do código: `apps/api/src/docs`. Para exportar o YAML: `npm run openapi`.
servers:
  - url: /api/v1
    description: API v1
tags:
  - name: Saúde
    description: Verificação de que a API e o banco estão de pé.
  - name: Autenticação
    description: Cadastro, login (próprio ou Firebase), perfil e upgrade para lojista.
  - name: Categorias
    description: Departamentos da vitrine.
  - name: Produtos
    description: Vitrine pública (Salva-Estoque) e gestão de produtos e estoque do lojista.
  - name: Pedidos
    description: Checkout do cliente e Kanban de pedidos do lojista.
  - name: PDV
    description: "Modo PDV: venda de balcão do lojista."
  - name: Rede B2B
    description: "Rede Anti-Ruptura: excedentes de lojas vizinhas (só lojista)."
  - name: Lojas
    description: Configurações e página pública da loja (horários, entrega, pagamentos).
  - name: Endereços
    description: Endereços de entrega do usuário logado.
  - name: Relatórios
    description: Resumo de vendas da loja por período (só lojista).
  - name: Analytics
    description: Dashboard analítico do lojista.
  - name: Operação
    description: Telemetria da vitrine, fila de impressão do caixa e notificações push (PWA).
  - name: Ofertas do Bairro
    description: Ofertas dos supermercados do bairro, encartes e cupons.
  - name: Tá Quentinho
    description: Ofertas relâmpago geolocalizadas e alertas "perto de casa".
  - name: Clube VIP
    description: "Assinatura Selo Vizinho VIP: planos, cobrança, adesão das lojas e webhooks do provedor."
  - name: Logística
    description: "Entrega: configuração da loja, chamado de entregador, rastreamento e área do entregador."
  - name: Caderneta
    description: "Caderneta (fiado): contas, pagamentos, ajustes e extrato."
  - name: Agendamento
    description: Encomendas, faixas de retirada e agenda.
  - name: Prato do dia
    description: Cardápio do dia e combos.
  - name: Carrinho Inteligente
    description: Itens canônicos, receitas, listas de compras e otimizador de lojas.
paths:
  /analytics/dashboard:
    get:
      operationId: getAnalyticsDashboard
      tags:
        - Analytics
      summary: Dashboard analítico da loja
      description: |-
        Sempre da loja de quem está logado. `status`: `valid` (padrão, sem cancelados), `all` ou lista separada por vírgula. Resposta com `Cache-Control: private, max-age=15`.

        Exige login com papel `MERCHANT` (lojista).
      security:
        - bearerAuth: []
      x-required-role: MERCHANT
      parameters:
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
        - name: status
          in: query
          required: false
          schema:
            default: valid
            type: string
        - name: abcTop
          in: query
          required: false
          schema:
            default: 30
            type: integer
            minimum: 5
            maximum: 100
      responses:
        "200":
          description: Indicadores, funil, séries e rankings do período.
          content:
            application/json:
              schema: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /auth/become-merchant:
    post:
      operationId: postAuthBecomeMerchant
      tags:
        - Autenticação
      summary: Transforma a conta em lojista (cria a loja)
      description: Exige login (qualquer papel).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                store:
                  type: object
                  properties:
                    name:
                      type: string
                      minLength: 2
                      maxLength: 120
                    neighborhood:
                      type: string
                      minLength: 2
                      maxLength: 80
                    city:
                      type: string
                      minLength: 2
                      maxLength: 80
                    state:
                      default: CE
                      type: string
                      minLength: 2
                      maxLength: 2
                  required:
                    - name
                    - neighborhood
                    - city
              required:
                - store
      responses:
        "200":
          description: Perfil já como lojista.
          content:
            application/json:
              schema: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/firebase:
    post:
      operationId: postAuthFirebase
      tags:
        - Autenticação
      summary: Troca um ID token do Firebase Auth pelo token da API
      description: |-
        Responde 501 quando o servidor não tem `FIREBASE_PROJECT_ID`.

        Pública (sem login).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idToken:
                  type: string
                  minLength: 20
                name:
                  type: string
                  minLength: 2
                  maxLength: 120
              required:
                - idToken
      responses:
        "200":
          description: Usuário e token JWT da API.
          content:
            application/json:
              schema: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /auth/login:
    post:
      operationId: postAuthLogin
      tags:
        - Autenticação
      summary: Entra com e-mail e senha
      description: Pública (sem login).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
              required:
                - email
                - password
      responses:
        "200":
          description: Usuário e token JWT da API.
          content:
            application/json:
              schema: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/me:
    get:
      operationId: getAuthMe
      tags:
        - Autenticação
      summary: Perfil do usuário logado
      description: Exige login (qualquer papel).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dados do usuário (e da loja, se for lojista).
          content:
            application/json:
              schema: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: patchAuthMe
      tags:
        - Autenticação
      summary: Atualiza o perfil do usuário logado
      description: Exige login (qualquer papel).
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 120
                phone:
                  anyOf:
                    - type: string
                      minLength: 8
                      maxLength: 30
                    - type: "null"
                store:
                  type: object
                  properties:
                    name:
                      type: string
                      minLength: 2
                      maxLength: 120
                    neighborhood:
                      type: string
                      minLength: 2
                      maxLength: 80
                    city:
                      type: string
                      minLength: 2
                      maxLength: 80
                    state:
                      type: string
                      minLength: 2
                      maxLength: 2
                    latitude:
                      anyOf:
                        - type: number
                          minimum: -90
                          maximum: 90
                        - type: "null"
                    longitude:
                      anyOf:
                        - type: number
                          minimum: -180
                          maximum: 180
                        - type: "null"
      responses:
        "200":
          description: Perfil atualizado.
          content:
            application/json:
              schema: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /auth/register:
    post:
      operationId: postAuthRegister
      tags:
        - Autenticação
      summary: Cria uma conta (cliente)
      description: Pública (sem login).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 120
                email:
                  type: string
                  maxLength: 254
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
              required:
                - name
                - email
                - password
      responses:
        "201":
          description: Usuário criado, com o token JWT da API.
          content:
            application/json:
              schema: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /b2b/alerts:
    get:
      operationId: getB2bAlerts
      tags:
        - Rede B2B
      summary: Meus esgotados que a vizinhança consegue suprir
      description: Exige login com papel `MERCHANT` (lojista).
      security:
        - bearerAuth: []
      x-required-role: MERCHANT
      responses:
        "200":
          description: Lista de alertas.
          content:
            application/json:
              schema: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /b2b/search:
    get:
      operationId: getB2bSearch
      tags:
        - Rede B2B
      summary: Busca excedente de um item em lojas vizinhas
      description: Exige login com papel `MERCHANT` (lojista).
      security:
        - bearerAuth: []
      x-required-role: MERCHANT
      parameters:
        - name: barcode
          in: query
          required: false
          schema:
            type: string
            pattern: ^\d{8,14}$
        - name: productId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: radiusKm
          in: query
          required: false
          schema:
            default: 5
            type: number
            minimum: 0.1
            maximum: 50
      responses:
        "200":
          description: Ofertas ordenadas por distância.
          content:
            application/json:
              schema: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /categories:
    get:
      operationId: getCategories
      tags:
        - Categorias
      summary: Lista os departamentos com a quantidade de produtos vendáveis hoje
      description: Pública (sem login).
      security: []
      responses:
        "200":
          description: Lista de `{ id, name, productCount }`.
          content:
            application/json:
              schema: {}
    post:
      operationId: postCategories
      tags:
        - Categorias
      summary: Cria uma categoria
      description: Exige login com papel `MERCHANT` (lojista).
      security:
        - bearerAuth: []
      x-required-role: MERCHANT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 80
              required:
                - name
      responses:
        "201":
          description: Categoria criada.
          content:
            application/json:
              schema: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /combos:
    get:
      operationId: getCombos
      tags:
        - Prato do dia
      summary: Combos (opcionalmente de uma loja)
      description: Pública (sem login).
      security: []
      parameters:
        - name: merchantId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Lista de combos.
          content:
            application/json:
              schema: {}
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: postCombos
      tags:
        - Prato do dia
      summary: Cadastra um combo
      description: Exige login com papel `MERCHANT` (lojista).
      security:
        - bearerAuth: []
      x-required-role: MERCHANT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 160
                description:
                  anyOf:
                    - type: string
                      maxLength: 2000
                    - type: "null"
                categoryId:
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 9007199254740991
                price:
                  type: number
                  minimum: 0
                  maximum: 1000000
                image:
                  anyOf:
                    - type: string
                      maxLength: 255
                    - type: "null"
                components:
                  minItems: 2
                  maxItems: 30
                  type: array
                  items:
                    type: object
                    properties:
                      componentId:
                        type: string
                        format: uuid
                      quantity:
                        default: 1
                        type: integer
                        minimum: 1
                        maximum: 99
                    required:
                      - componentId
              required:
                - name
                - categoryId
                - price
                - components
      responses:
        "201":
          description: Combo criado.
          content:
            application/json:
              schema: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /combos/{id}:
    delete:
      operationId: deleteCombosById
      tags:
        - Prato do dia
      summary: Remove um combo
      description: Exige login com papel `MERCHANT` (lojista).
      security:
        - bearerAuth: []
      x-required-role: MERCHANT
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removido.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /combos/mine:
    get:
      operationId: getCombosMine
      tags:
        - Prato do dia
      summary: Meus combos
      description: Exige login com papel `MERCHANT` (lojista).
      security:
        - bearerAuth: []
      x-required-role: MERCHANT
      responses:
        "200":
          description: Lista de combos da loja.
          content:
            application/json:
              schema: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /coupons/mine:
    get:
      operationId: getCouponsMine
      tags:
        - Ofertas do Bairro
      summary: Meus cupons
      description: Exige login (qualquer papel).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de cupons.
          content:
            application/json:
              schema: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
  /credit/accounts:
    get:
      operationId: getCreditAccounts
      tags:
        - Caderneta
      summary: Contas da caderneta da loja
      description: Exige login com papel `MERCHANT` (lojista).
      security:
        - bearerAuth: []
      x-required-role: MERCHANT
      parameters:
        - name: owing
          in: query
          required: false
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - ACTIVE
              - SUSPENDED
              - CLOSED
        - name: limit
          in: query
          required: false
          schema:
            default: 100
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Lista de contas com saldo.
          content:
            application/json:
              schema: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: postCreditAccounts
      tags:
        - Caderneta
      summary: Abre uma conta na caderneta para um cliente
      description: Exige login com papel `MERCHANT` (lojista).
      security:
        - bearerAuth: []
      x-required-role: MERCHANT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customerId:
                  type: string
                  format: uuid
                creditLimit:
                  default: 0
                  type: number
                  minimum: 0
                  maximum: 99999999.99
                settlementDay:
                  anyOf:
                    - type: integer
                      minimum: 1
                      maximum: 28
                    - type: "null"
              required:
                - customerId
      responses:
        "201":
          description: Conta criada.
          content:
            application/json:
              schema: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /credit/accounts/{id}:
    patch:
      operationId: patchCreditAccountsById
      tags:
        - Caderneta
      summary: Atualiza limite/situação de uma conta
      description: Exige login com papel `MERCHANT` (lojista).
      security:
        - bearerAuth: []
      x-required-role: MERCHANT
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                creditLimit:
                  type: number
                  minimum: 0
                  maximum: 99999999.99
                status:
                  type: string
                  enum:
                    - ACTIVE
                    - SUSPENDED
                    - CLOSED
                settlementDay:
                  anyOf:
                    - type: integer
                      minimum: 1
                      maximum: 28
                    - type: "null"
      responses:
        "200":
          description: Conta atualizada.
          content:
            application/json:
              schema: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /credit/accounts/{id}/adjustments:
    post:
      operationId: postCreditAccountsByIdAdjustments
      tags:
        - Caderneta
      summary: Lança um ajuste manual
      description: Exige login com papel `MERCHANT` (lojista).
      security:
        - bearerAuth: []
      x-required-role: MERCHANT
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  minimum: -99999999.99
                  maximum: 99999999.99
                note:
                  type: string
                  minLength: 1
                  maxLength: 500
              required:
                - amount
                - note
      responses:
        "201":
          description: Lançamento criado.
          content:
            application/json:
              schema: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /credit/accounts/{id}/ledger:
    get:
      operationId: getCreditAccountsByIdLedger
      tags:
        - Caderneta
      summary: Extrato de uma conta (lojista da conta ou cliente dono)
      description: Exige login (qualquer papel).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            default: 100
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Lançamentos do mais recente ao mais antigo.
          content:
            application/json:
              schema: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /credit/accounts/{id}/payments:
    post:
      operationId: postCreditAccountsByIdPayments
      tags:
        - Caderneta
      summary: Registra um pagamento recebido
      description: Exige login com papel `MERCHANT` (lojista).
      security:
        - bearerAuth: []
      x-required-role: MERCHANT
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 99999999.99
                paymentMethod:
                  type: string
                  minLength: 1
                  maxLength: 20
                note:
                  type: string
                  minLength: 1
                  maxLength: 500
              required:
                - amount
      responses:
        "201":
          description: Lançamento criado.
          content:
            application/json:
              schema: {}
        "400":
