  /deals/flyers:
    post:
      operationId: postDealsFlyers
      tags:
        - Ofertas do Bairro
      summary: Envia um encarte (PDF/JPEG/PNG/WebP) para leitura das ofertas
      description: |-
        O corpo da requisição é o próprio arquivo (qualquer `Content-Type`; o tipo real é conferido pelos bytes). Parâmetros na query: `?chain=sao-luiz&neighborhood=Aldeota`. Responde 202 na hora; acompanhe em `GET /deals/flyers/{id}`.

        Exige login com papel `MERCHANT` (lojista).
      security:
        - bearerAuth: []
      x-required-role: MERCHANT
      parameters:
        - name: chain
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 40
        - name: neighborhood
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: validDays
          in: query
          required: false
          schema:
            default: 7
            type: integer
            minimum: 1
            maximum: 30
        - name: append
          in: query
          required: false
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - name: fileName
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        description: Bytes do encarte (até 20 MB).
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "202":
          description: Encarte aceito; a leitura roda em segundo plano.
          content:
            application/json:
              schema: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
