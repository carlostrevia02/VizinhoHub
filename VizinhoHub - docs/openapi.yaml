        Exige login com papel `CUSTOMER` (cliente).
      security:
        - bearerAuth: []
      x-required-role: CUSTOMER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  minItems: 1
                  maxItems: 50
                  type: array
                  items:
                    type: object
                    properties:
                      productId:
                        type: string
                        format: uuid
                      flashOfferId:
                        type: string
                        format: uuid
                      quantity:
                        type: integer
                        minimum: 1
                        maximum: 99
                    required:
                      - quantity
                customerName:
                  type: string
                  minLength: 1
                  maxLength: 120
                phone:
                  type: string
                  minLength: 1
                  maxLength: 30
                deliveryMethod:
                  type: string
                  minLength: 1
                  maxLength: 60
                notes:
                  type: string
                  minLength: 1
                  maxLength: 500
                deliveryAddress:
                  type: string
                  minLength: 3
                  maxLength: 300
                fulfillment:
                  type: string
                  enum:
                    - PICKUP
                    - DELIVERY
                deliveryLat:
                  type: number
                  minimum: -90
                  maximum: 90
                deliveryLng:
                  type: number
                  minimum: -180
                  maximum: 180
                paymentMethod:
                  type: string
                  enum:
                    - pix
                    - card
                    - cash
                    - credit
                schedule:
                  type: object
                  properties:
                    scheduledFor:
                      type: string
                      format: date-time
